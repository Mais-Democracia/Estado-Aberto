[Service]
User=__AI_LOGIN_USER__
Environment=
Environment=PATH=/usr/local/bin:/usr/bin:/bin
Environment=HOME=__AI_LOGIN_HOME__
Environment=CLAUDE_BIN=__AI_LOGIN_HOME__/.local/bin/claude
Environment=ESTADO_ABERTO_DATA=/var/lib/estado-aberto/data
Environment=ESTADO_ABERTO_STATE=/var/lib/estado-aberto/state
Environment=STATE_DIR=/var/lib/estado-aberto/state
Environment=AI_AUTH_MODE=login
UnsetEnvironment=ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN ANTHROPIC_BASE_URL CLAUDE_CODE_OAUTH_TOKEN
ExecStartPre=
ProtectSystem=strict
ProtectHome=tmpfs
BindPaths=-__AI_LOGIN_HOME__/.claude -__AI_LOGIN_HOME__/.claude.json
BindReadOnlyPaths=__AI_LOGIN_HOME__/.local
ReadWritePaths=__AI_LOGIN_HOME__/.claude -__AI_LOGIN_HOME__/.claude.json /var/lib/estado-aberto/state/ai
ReadOnlyPaths=/var/lib/estado-aberto/data
InaccessiblePaths=-/etc/estado-aberto/updater.env -/etc/estado-aberto/app.env -/etc/estado-aberto/ingest.env -/etc/sudoers.d -/var/lib/estado-aberto/data/user.db -/var/lib/estado-aberto/data/politica.db -/var/lib/estado-aberto/data/risco.db -/var/lib/estado-aberto/data/responsaveis.db -/var/lib/estado-aberto/data/votacoes.db -/var/lib/estado-aberto/data/deputados.db -/var/lib/estado-aberto/data/posicoes.db
PrivateTmp=yes
PrivateDevices=yes
NoNewPrivileges=yes
MemoryHigh=380M
MemoryMax=450M
